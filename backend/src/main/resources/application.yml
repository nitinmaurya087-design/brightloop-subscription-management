spring:
  application:
    name: brightloop-api
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  health:
    mail:
      enabled: ${SMTP_ENABLED:false}
brightloop:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  password-reset:
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:false}
  mail:
    enabled: ${SMTP_ENABLED:false}
