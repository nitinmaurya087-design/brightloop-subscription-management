spring:
  datasource:
    url: jdbc:h2:mem:brightloop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /dev/h2-console
  flyway:
    locations: classpath:db/migration,classpath:db/dev

brightloop:
  jwt:
    secret: ${JWT_SECRET:local-only-development-secret-change-before-production-123456789}
  password-reset:
    expose-token: false
